name: World research - E3 H26 gradual granular feeding
on:
  push:
    branches:
      - research/world-foundations-2026-11
    paths:
      - WORLD_RESEARCH/experiments/probe_e3_h26_gradual_grain_feed.py
      - .github/workflows/world-e3-gradual-grain-feed.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gradual_feed:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified PyBullet runtime and owner serialization
        run: |
          python -m pip install --only-binary=:all: pybullet==3.2.7 numpy scipy xarray
      - name: Execute preregistered H26 progressive source, friction and replay tests
        run: |
          python WORLD_RESEARCH/experiments/probe_e3_h26_gradual_grain_feed.py
