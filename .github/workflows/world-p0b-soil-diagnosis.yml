name: World research - P0-B soil restart diagnosis
on:
  push:
    branches:
      - research/world-foundations-2026-11
    paths:
      - WORLD_RESEARCH/experiments/p0b_diagnose_soil_restart.py
      - .github/workflows/world-p0b-soil-diagnosis.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: h41-raw
          run-id: 45389348480
          github-token: ${{ github.token }}
          path: raw
      - uses: actions/download-artifact@v4
        with:
          name: p0a-results
          run-id: 45399630729
          github-token: ${{ github.token }}
          path: p0a-results
      - uses: actions/download-artifact@v4
        with:
          name: p0b-checkpoints
          run-id: 45400499614
          github-token: ${{ github.token }}
          path: p0b-checkpoints
      - uses: actions/download-artifact@v4
        with:
          name: p0b-results
          run-id: 45400499614
          github-token: ${{ github.token }}
          path: p0b-results
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.18'
      - run: |
          python -m pip install --only-binary=:all: landlab==2.11.0 numpy==2.5.5 xarray==2026.9.0 scipy==1.18.1
          lscpu
          python -m pip freeze
      - run: |
          python WORLD_RESEARCH/experiments/p0b_diagnose_soil_restart.py raw/worldengine_two_seeds.npz p0a-results p0b-checkpoints p0b-results diagnosis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0b-diagnosis-${{ matrix.replica }}
          path: diagnosis
          retention-days: 30
