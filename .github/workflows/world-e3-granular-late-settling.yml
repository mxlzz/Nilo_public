name: World research - E3 H25 late granular pile settling
on:
  push:
    branches:
      - research/world-foundations-2026-11
    paths:
      - WORLD_RESEARCH/experiments/probe_e3_h25_granular_settling.py
      - .github/workflows/world-e3-granular-late-settling.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  granular_settling:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install previously tested PyBullet runtime
        run: |
          python -m pip install --only-binary=:all: pybullet==3.2.7 numpy scipy xarray
      - name: Verify H24 trajectory prefix and H25 natural late settling
        run: |
          python WORLD_RESEARCH/experiments/probe_e3_h25_granular_settling.py
