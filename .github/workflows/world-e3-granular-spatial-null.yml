name: World research - E3 H27 conditioned hard-sphere spatial null
on:
  push:
    branches:
      - research/world-foundations-2026-11
    paths:
      - WORLD_RESEARCH/experiments/probe_e3_h27_hardcore_spatial_null.py
      - .github/workflows/world-e3-granular-spatial-null.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conditioned_null:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing Bullet physics and SciPy graph statistics
        run: |
          python -m pip install --only-binary=:all: pybullet==3.2.7 numpy scipy xarray
      - name: Compare original H26 exact owner with preregistered hard-sphere nulls
        run: |
          python WORLD_RESEARCH/experiments/probe_e3_h27_hardcore_spatial_null.py
