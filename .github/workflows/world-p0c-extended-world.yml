name: World research - P0-C extended horizon and restart
on:
  push:
    branches:
      - research/world-foundations-2026-11
    paths:
      - WORLD_RESEARCH/experiments/p0c_extended_world.py
      - WORLD_RESEARCH/experiments/p0c_landlab_worker.py
      - .github/workflows/world-p0c-extended-world.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  NPY_DISABLE_CPU_FEATURES: X86_V3,X86_V4,AVX512_ICL,AVX512_SPR
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: h41-raw
          run-id: 45389348480
          github-token: ${{ github.token }}
          path: raw
      - uses: actions/setup-python@v5
        id: landlab
        with:
          python-version: '3.13.18'
      - run: |
          "${{ steps.landlab.outputs.python-path }}" -m pip install --only-binary=:all: landlab==2.11.0 numpy==2.5.5 xarray==2026.9.0 scipy==1.18.1
          "${{ steps.landlab.outputs.python-path }}" -m pip freeze
      - uses: actions/setup-python@v5
        id: bullet
        with:
          python-version: '3.11.18'
      - run: |
          "${{ steps.bullet.outputs.python-path }}" -m pip install --only-binary=:all: pybullet==3.2.7 numpy==2.4.6 xarray==2026.9.0 scipy==1.17.1
          "${{ steps.bullet.outputs.python-path }}" -m pip freeze
          lscpu
      - run: |
          "${{ steps.bullet.outputs.python-path }}" WORLD_RESEARCH/experiments/p0c_extended_world.py produce raw/worldengine_two_seeds.npz "${{ steps.landlab.outputs.python-path }}" p0c-checkpoints p0c-continuous
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0c-checkpoints
          path: p0c-checkpoints
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0c-continuous
          path: p0c-continuous
          retention-days: 30
  consume:
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: h41-raw
          run-id: 45389348480
          github-token: ${{ github.token }}
          path: raw
      - uses: actions/download-artifact@v4
        with:
          name: p0c-checkpoints
          path: p0c-checkpoints
      - uses: actions/setup-python@v5
        id: landlab
        with:
          python-version: '3.13.18'
      - run: |
          "${{ steps.landlab.outputs.python-path }}" -m pip install --only-binary=:all: landlab==2.11.0 numpy==2.5.5 xarray==2026.9.0 scipy==1.18.1
          "${{ steps.landlab.outputs.python-path }}" -m pip freeze
      - uses: actions/setup-python@v5
        id: bullet
        with:
          python-version: '3.11.18'
      - run: |
          "${{ steps.bullet.outputs.python-path }}" -m pip install --only-binary=:all: pybullet==3.2.7 numpy==2.4.6 xarray==2026.9.0 scipy==1.17.1
          "${{ steps.bullet.outputs.python-path }}" -m pip freeze
          lscpu
      - run: |
          "${{ steps.bullet.outputs.python-path }}" WORLD_RESEARCH/experiments/p0c_extended_world.py consume raw/worldengine_two_seeds.npz "${{ steps.landlab.outputs.python-path }}" p0c-checkpoints p0c-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0c-results
          path: p0c-results
          retention-days: 30
