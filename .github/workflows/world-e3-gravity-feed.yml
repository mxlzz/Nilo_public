name: World research - E3 H26 gravity-fed granular aggregate
on:
  push:
    branches:
      - research/world-foundations-2026-11
    paths:
      - WORLD_RESEARCH/experiments/probe_e3_h26_gravity_feed.py
      - .github/workflows/world-e3-gravity-feed.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controlled_feed:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing PyBullet and xarray dependencies
        run: |
          python -m pip install --only-binary=:all: pybullet==3.2.7 numpy scipy xarray
      - name: Execute preregistered gravity feed, friction ablation, reservoir and owner tests
        run: |
          python WORLD_RESEARCH/experiments/probe_e3_h26_gravity_feed.py
