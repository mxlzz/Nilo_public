name: NeuroLab I3c5a — preregistered delayed-credit forks

on:
  push:
    branches:
      - 'docs/neurolab-*'
      - 'work/neurolab-*'
    paths:
      - 'experiments/neurolab/e09_i3c5a_credit_forks.py'
      - 'experiments/neurolab/tests/test_e09_i3c5a_credit_forks.py'
      - '.github/workflows/neurolab-i3c5a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preregistered-credit-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify preregistered contracts on independent observer
        run: python -m unittest -v experiments.neurolab.tests.test_e09_i3c5a_credit_forks
      - name: Run fixed 20 seeds and archive full per-tick witnesses
        run: |
          mkdir -p metrics
          python -m experiments.neurolab.e09_i3c5a_credit_forks --output metrics/e09i3c5a.json | tee metrics/summary.json
          python - <<'PY'
          import json
          p = 'metrics/e09i3c5a.json'
          r = json.load(open(p, encoding='utf-8'))
          assert r['protocol'] == 'NL-EXP-I3c5a-v1'
          assert r['seeds'] == list(range(1200, 1220))
          assert r['n_trunks'] == 80 and r['n_branches'] == 400
          assert len(r['per_seed_sha256']) == 20
          assert r['G05_G09_G00H'].startswith('OPEN')
          assert all(len(s['episodes']) == 4 for s in r['per_seed'])
          print('SUMMARY:', {k:r[k] for k in (
              'n_trunks','n_branches','missing_actions','timing_contrasts'
          )})
          import statistics
          episodes=[ep for seed in r['per_seed'] for ep in seed['episodes']]
          print('OBSERVED OUTCOMES:', {str(sign): sum(ep['correct'] is sign for ep in episodes) for sign in (True,False,None)})
          for mode in ('N','D0','D1','D2','D3'):
              b=[ep['branches'][mode] for ep in episodes]
              fractions=[x['target_fraction_attributed'] for x in b if x['target_fraction_attributed'] is not None]
              candidate=[x['candidate_fraction_attributed'] for x in b if x['candidate_fraction_attributed'] is not None]
              print('MODE', mode, {
                'deliveries':sum(x['delivered'] for x in b),
                'chem0_auc_mean':round(statistics.mean(x['chemical_auc'][0] for x in b),3),
                'chem1_auc_mean':round(statistics.mean(x['chemical_auc'][1] for x in b),3),
                'target_fraction_mean':round(statistics.mean(fractions),5) if fractions else None,
                'target_fraction_n':len(fractions),
                'candidate_fraction_mean':round(statistics.mean(candidate),5) if candidate else None,
                'readout_accuracy':round(statistics.mean(x['final_readout_correct'] for x in b),5),
                'stw_target_abs_gate128_mean':round(statistics.mean(x['gates']['128']['target_stw_abs'] for x in b),3),
                'ltw_target_abs_gate256_mean':round(statistics.mean(x['gates']['256']['target_ltw_abs'] for x in b),3),
                'strength0_gate256_mean':round(statistics.mean(x['gates']['256']['strength0'] for x in b),3),
              })
          PY
          sha256sum metrics/e09i3c5a.json > metrics/artifact.sha256
      - name: Preserve positive and negative per-seed outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurolab-i3c5a-credit-forks
          path: metrics/
          retention-days: 90
          if-no-files-found: warn
