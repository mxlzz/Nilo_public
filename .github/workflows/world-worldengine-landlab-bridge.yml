name: World - generator checkout validation
on:
  push:
    branches:
      - research/world-foundations-2026-11
    paths:
      - .github/workflows/world-worldengine-landlab-bridge.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export_height:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone WorldEngine upstream
        run: git clone --depth 1 https://github.com/Mindwerks/worldengine.git upstream
      - name: Record WorldEngine source commit
        run: git -C upstream rev-parse HEAD
      - name: Install original generator
        run: python -m pip install --no-cache-dir ./upstream
      - name: Generate initial elevation
        run: python research/WORLD_RESEARCH/experiments/export_worldengine_height.py worldengine_height.npz
      - uses: actions/upload-artifact@v4
        with:
          name: worldengine-height
          path: worldengine_height.npz
