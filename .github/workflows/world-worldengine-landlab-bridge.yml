name: World - generator bridge validation
on:
  push:
    branches:
      - research/world-foundations-2026-11
    paths:
      - .github/workflows/world-worldengine-landlab-bridge.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export_height:
    runs-on: ubuntu-24.04
    steps:
      - name: Export test data
        run: echo "valid datum" > input.txt
      - uses: actions/upload-artifact@v4
        with:
          name: height-data
          path: input.txt
  simulate_terrain:
    needs: export_height
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: height-data
      - name: Verify data
        run: grep -q "valid datum" input.txt
