name: World research - E1 H16 mixed-material energy-owner gate
on:
  push:
    branches:
      - research/world-foundations-2026-11
    paths:
      - WORLD_RESEARCH/experiments/probe_e1_h16_dual_material_heat.py
      - .github/workflows/world-e1-dual-material-heat.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared_material_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FiPy physics plus storage/array dependencies
        run: |
          python -m pip install --only-binary=:all: fipy==4.0.3 numpy scipy xarray
      - name: Execute H16 registered composition, mass, energy, volume, phase and replay gates
        run: python WORLD_RESEARCH/experiments/probe_e1_h16_dual_material_heat.py
