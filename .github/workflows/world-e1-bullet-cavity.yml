name: World research - E1 H8 Bullet cavity and owner
on:
  push:
    branches:
      - research/world-foundations-2026-11
    paths:
      - WORLD_RESEARCH/experiments/probe_e1_bullet_cavity_owner.py
      - .github/workflows/world-e1-bullet-cavity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cavity_support:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing physics engine and state libraries
        run: |
          python -m pip install --only-binary=:all: pybullet==3.2.7 numpy scipy xarray landlab
          python -m pip show pybullet landlab xarray
      - name: H8 cavity-vs-heightfield placement, live physics support and mass ownership
        run: python WORLD_RESEARCH/experiments/probe_e1_bullet_cavity_owner.py
