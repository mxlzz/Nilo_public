name: World research - H40 live body across actual sediment epochs
on:
  push:
    branches:
      - research/world-foundations-2026-11
    paths:
      - WORLD_RESEARCH/experiments/probe_h40_soil_epochs.py
      - WORLD_RESEARCH/experiments/probe_h40_live_body_soil_epochs.py
      - .github/workflows/world-h40-live-body-soil-epochs.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_worldengine_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch original WorldEngine revision
        run: |
          mkdir -p "$RUNNER_TEMP/worldengine_h40"
          git -C "$RUNNER_TEMP/worldengine_h40" init -q
          git -C "$RUNNER_TEMP/worldengine_h40" remote add origin https://github.com/Mindwerks/worldengine.git
          git -C "$RUNNER_TEMP/worldengine_h40" fetch --depth 1 origin 3b9113ecfad884cab4b32081d138a15e6262ada8
          git -C "$RUNNER_TEMP/worldengine_h40" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/worldengine_h40" rev-parse HEAD)" = 3b9113ecfad884cab4b32081d138a15e6262ada8
          python -m pip install "$RUNNER_TEMP/worldengine_h40"
          python research/WORLD_RESEARCH/experiments/probe_e4_h29_worldengine_seeds.py worldengine_two_seeds.npz
      - uses: actions/upload-artifact@v4
        with:
          name: h40-raw
          path: worldengine_two_seeds.npz
          retention-days: 14
  native_landlab_epochs:
    needs: original_worldengine_source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: h40-raw
          path: world
      - run: |
          python -m pip install --only-binary=:all: landlab==2.11.0 numpy==2.5.5 xarray==2026.9.0 scipy
      - run: |
          python WORLD_RESEARCH/experiments/probe_h40_soil_epochs.py world/worldengine_two_seeds.npz soils
      - uses: actions/upload-artifact@v4
        with:
          name: h40-soil-epochs
          path: soils
          retention-days: 14
  same_body_on_three_terrains:
    needs: [original_worldengine_source,native_landlab_epochs]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: h40-raw
          path: world
      - uses: actions/download-artifact@v4
        with:
          name: h40-soil-epochs
          path: soils
      - run: |
          python -m pip install --only-binary=:all: pybullet==3.2.7 numpy==2.4.6 xarray==2026.9.0 scipy==1.17.1
      - run: |
          python WORLD_RESEARCH/experiments/probe_h40_live_body_soil_epochs.py world/worldengine_two_seeds.npz soils
