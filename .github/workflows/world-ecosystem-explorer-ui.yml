name: World research - H16 Ecosystem Explorer public browser smoke
on:
  push:
    branches:
      - research/world-foundations-2026-11
    paths:
      - WORLD_RESEARCH/experiments/probe_ecosystem_explorer_browser.py
      - .github/workflows/world-ecosystem-explorer-ui.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ecosystem_explorer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run single public browser session and record visible UI metrics
        run: python WORLD_RESEARCH/experiments/probe_ecosystem_explorer_browser.py
