name: World research - E3 H22 Cahn-Hilliard epsilon ablation
on:
  push:
    branches:
      - research/world-foundations-2026-11
    paths:
      - WORLD_RESEARCH/experiments/probe_e3_h22_spinodal_epsilon.py
      - .github/workflows/world-e3-spinodal-epsilon.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  epsilon_ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install same FiPy and numerical libraries as H21
        run: |
          python -m pip install --only-binary=:all: fipy==4.0.3 numpy scipy xarray
      - name: Evaluate H22 preregistered interfacial-scale contrast and controls
        run: |
          python WORLD_RESEARCH/experiments/probe_e3_h22_spinodal_epsilon.py
