name: Validación Nilo
on:
  push:
    branches: [main, "work/**", "refactor/**"]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Auditoría de dependencias y ciclos (Nilo 0.7)
        run: python tools/auditar_arquitectura.py
      - name: Auditoría de identidad y RNG del dominio (Nilo 0.7)
        run: python tools/auditar_identidad_07.py
      - name: Auditoría de catálogo, contratos y dispatch de operaciones (Nilo 0.7)
        run: python tools/auditar_operaciones_07.py
      - name: Auditoría del motor headless y fachada HTTP (Nilo 0.7)
        run: python tools/auditar_orquestador_07.py
      - name: Auditoría de topología y generación del mundo (Nilo 0.7)
        run: python tools/auditar_mundo_08.py
      - name: Mundo isla_v1 contra snapshots 0.6.4 y seis semillas
        run: python -m unittest discover -s tests -p 'test_mundo_08.py' -v
      - name: Motor headless y adaptadores (regresión focalizada)
        run: timeout 90s python -m unittest discover -s tests -p 'test_orquestador_07.py' -v
      - name: Pruebas sin credenciales
        run: python -m unittest discover -s tests -v
      - name: Continuidad RNG/IDs entre procesos y semillas globales (#143)
        run: python tools/verificar_identidad_07.py
      - name: Escenarios físicos deterministas
        run: python validar_escenarios.py --seed 7321
      - name: Reproducir decisiones y estados sin proveedor
        run: python reproducir.py tests/fixtures/replay_basico.json
      - name: Importar runtime desde ZIP portable (sin publicar release)
        run: python tools/verificar_paquete_07.py
      - name: Comparar huellas entre procesos independientes
        shell: bash
        run: |
          PYTHONHASHSEED=11 python reproducir.py tests/fixtures/replay_basico.json --diagnostics --output /tmp/replay_a.json > /dev/null
          PYTHONHASHSEED=97 python reproducir.py tests/fixtures/replay_basico.json --diagnostics --output /tmp/replay_b.json > /dev/null
          python - <<'PY'
          import json
          a=json.load(open('/tmp/replay_a.json'))
          b=json.load(open('/tmp/replay_b.json'))
          for key in ('state_sha256','archive_sha256','fingerprint'):
              print(key,a[key],b[key])
          for k in ('state_fields','person_fields','world_fields','archive_history_categories'):
              da=a['diagnostics'][k]; db=b['diagnostics'][k]
              delta={key:(da.get(key),db.get(key)) for key in sorted(set(da)|set(db)) if da.get(key)!=db.get(key)}
              if delta: print('DIFERENCIAS',k,delta)
          assert a['fingerprint']==b['fingerprint'], 'Reproducción entre procesos diferente'
          PY
