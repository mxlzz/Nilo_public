name: NeuroLab E09 TAB2 — E03 exact fair tabular equivalence

on:
  push:
    branches:
      - 'docs/neurolab-*'
      - 'work/neurolab-*'
    paths:
      - 'experiments/neurolab/e09_binary_tabular_equivalence.py'
      - 'experiments/neurolab/tests/test_e09_binary_tabular_equivalence.py'
      - '.github/workflows/neurolab-e09-tab2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fair-binary-table:
    name: Independent exact E03 reset-brain vs 2x2 table
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent identity, ties, abstention and out-of-domain tests
        run: python -m unittest -v experiments.neurolab.tests.test_e09_binary_tabular_equivalence
      - name: Replay original E03 20-seed original and reversal episodes
        run: |
          mkdir -p metrics
          python -m experiments.neurolab.e09_binary_tabular_equivalence > metrics/e09_tab2.json
          python - <<'PY'
          import json
          d=json.load(open('metrics/e09_tab2.json'))
          assert d['protocol']=='E09.05-TAB2-v1'
          assert d['seeds']==list(range(20))
          assert d['n_seeds']==20
          assert d['all_equal'] and d['discrepancies']==0
          assert d['two_input_comparisons']==10480
          assert d['holdout_comparisons']==3200
          assert d['online_updates']==5200
          assert not d['confirmatory_cohort_used']
          print('E09 TAB2 equivalence',{
              k:d[k] for k in ('n_seeds','two_input_comparisons',
                  'holdout_comparisons','online_updates','discrepancies')
          })
          PY
          sha256sum metrics/e09_tab2.json > metrics/full.sha256
      - name: Retain reproducible paired trajectories summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurolab-e09-tab2-binary-tabular-exactness
          path: metrics/
          retention-days: 90
          if-no-files-found: warn
