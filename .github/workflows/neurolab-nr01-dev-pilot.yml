name: NeuroLab NR01 — preregistered development seed23000 pilot

on:
  push:
    branches: ['docs/neurolab-*']
    paths: ['.github/workflows/neurolab-nr01-dev-pilot.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-development-world:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install preregistered existing libraries
        run: python -m pip install --disable-pip-version-check 'artlib==0.1.12' 'scikit-learn==1.9.1'
      - name: Run one development world for each preregistered arm and family
        run: python -m experiments.neurolab.nr01_pilot
      - name: Preserve raw pilot results (including partial results on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nr01-development-pilot-23000
          path: |
            metrics/nr01_dev_pilot_23000.json
            metrics/nr01_dev_pilot_23000_progress.jsonl
          if-no-files-found: warn
          retention-days: 90
