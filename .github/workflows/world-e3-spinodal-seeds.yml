name: World research - E3 H23 late-time spinodal structure across seeds
on:
  push:
    branches:
      - research/world-foundations-2026-11
    paths:
      - WORLD_RESEARCH/experiments/probe_e3_h23_longrun_seeds.py
      - .github/workflows/world-e3-spinodal-seeds.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural_replication:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing NIST FiPy numerical runtime
        run: |
          python -m pip install --only-binary=:all: fipy==4.0.3 numpy scipy xarray
      - name: Evaluate H23 preregistered late persistence and independent seeds
        run: |
          python WORLD_RESEARCH/experiments/probe_e3_h23_longrun_seeds.py
