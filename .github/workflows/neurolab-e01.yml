name: NeuroLab isolated brain E01-E06

on:
  push:
    branches:
      - 'docs/neurolab-*'
      - 'work/neurolab-*'
    paths:
      - 'experiments/neurolab/**'
      - '.github/workflows/neurolab-e01.yml'
  pull_request:
    paths:
      - 'experiments/neurolab/**'
      - '.github/workflows/neurolab-e01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-unit-tests:
    name: Neuronal experiments E01-E06
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile neuron kernel and test code
        run: python -m py_compile experiments/neurolab/kernel.py experiments/neurolab/tests/test_kernel.py
      - name: E01 deterministic numerical oracles and state replay
        run: python -m unittest discover -s experiments/neurolab/tests -v

      - name: E01 benchmark 100k ticks
        run: python -m experiments.neurolab.bench

      - name: E03 preregistered 20-seed learning and reversal
        run: python -m experiments.neurolab.e03_protocol

      - name: E06 preregistered XOR context generalization
        run: python -m experiments.neurolab.e06_protocol
