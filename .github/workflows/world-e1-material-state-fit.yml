name: World research - E1 H1 state representations
on:
  push:
    branches:
      - research/world-foundations-2026-11
    paths:
      - WORLD_RESEARCH/experiments/probe_e1_state_representations.py
      - WORLD_RESEARCH/experiments/probe_e1_shared_state_views.py
      - .github/workflows/world-e1-material-state-fit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  material_state:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing MIT/Apache licensed data containers
        run: |
          python -m pip install --only-binary=:all: landlab numpy scipy xarray
          python -m pip show landlab xarray
      - name: Run previous untouched material invariants
        working-directory: WORLD_RESEARCH/experiments
        run: python -m unittest -v test_matter_v0.py
      - name: Test lossless projections, multi-layer separation, rejection and NetCDF
        run: python WORLD_RESEARCH/experiments/probe_e1_state_representations.py
      - name: E1 H2 zero-copy bidirectional ownership, corruption and rebind controls
        run: python WORLD_RESEARCH/experiments/probe_e1_shared_state_views.py
