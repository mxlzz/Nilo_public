name: World research - E3 H28 hard-core Markov-chain spatial null
on:
  push:
    branches:
      - research/world-foundations-2026-11
    paths:
      - WORLD_RESEARCH/experiments/probe_e3_h28_mcmc_spatial_null.py
      - .github/workflows/world-e3-granular-mcmc-null.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hard_core_mcmc:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install previous PyBullet and scipy numerical dependencies
        run: |
          python -m pip install --only-binary=:all: pybullet==3.2.7 numpy scipy xarray
      - name: Run H28 2-chain per seed hard-core MCMC null and mixing checks
        run: |
          python WORLD_RESEARCH/experiments/probe_e3_h28_mcmc_spatial_null.py
