name: World research - E3 H21 conservative Cahn-Hilliard domains
on:
  push:
    branches:
      - research/world-foundations-2026-11
    paths:
      - WORLD_RESEARCH/experiments/probe_e3_h21_spinodal_fipy.py
      - .github/workflows/world-e3-spinodal-fipy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain_separation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested NIST FiPy, arrays and spatial statistics
        run: |
          python -m pip install --only-binary=:all: fipy==4.0.3 numpy scipy xarray
          python -m pip show fipy numpy scipy
      - name: Evaluate preregistered conservation, spinodal pattern, conditional null, replay and checkpoint
        run: python WORLD_RESEARCH/experiments/probe_e3_h21_spinodal_fipy.py
